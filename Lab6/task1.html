<!DOCTYPE html>
<html>
<head>
<title>Лабораторна робота №6 (Завдання 1)</title>
</head>
<body>
<script>
let s1 = prompt("Введіть ім'я та прізвище 1-го студента:");
while (s1 === null || s1 == "" || +s1 >= 0 || +s1 <= 0) {
alert("Помилка, ведіть будль ласка ще раз (ім'я та прізвище буквами).");
s1 = prompt("Введіть ім'я та прізвище 1-го студента:");
}
let s2 = prompt("Введіть ім'я та прізвище 2-го студента:");
while (s2 === null || s2 == "" || +s2 >= 0 || +s2 <= 0) {
alert("Помилка, ведіть будль ласка ще раз (ім'я та прізвище буквами).");
s2 = prompt("Введіть ім'я та прізвище 2-го студента:");
}
let s3 = prompt("Введіть ім'я та прізвище 3-го студента:");
while (s3 === null || s3 == "" || +s3 >= 0 || +s3 <= 0) {
alert("Помилка, ведіть будль ласка ще раз (ім'я та прізвище буквами).");
s3 = prompt("Введіть ім'я та прізвище 3-го студента:");
}
let check = confirm("Дані введено. Вивести список студентів на сторінку?");
if (check == true) {
alert("Виведення даних на вебсторінку");
document.write("<h3>Виведення у вигляді абзаців:</h3>");
document.write("<p>" + s1 + "</p>");
document.write("<p>" + s2 + "</p>");
document.write("<p>" + s3 + "</p>");
document.write("<h3>Виведення у вигляді нумерованого списку:</h3>");
document.write("<ol>");
document.write("<li>" + s1 + "</li>");
document.write("<li>" + s2 + "</li>");
document.write("<li>" + s3 + "</li>");
document.write("</ol>");
} else {
alert("Виведення скасовано.");
}
</script>
</body>
</html>
