<!DOCTYPE html>
<html>
<head>
<title>Лабораторна робота №7 (Завдання 1)</title>
</head>
<body>
<script>
function sumOrMinus() {
let res = 0;
if (arguments.length % 2 == 0) {
for (let i = 0; i < arguments.length; i++) {
res = res + arguments[i];
}
} else {
res = arguments[arguments.length - 1];
for (let i = arguments.length - 2; i >= 0; i--) {
res = res - arguments[i];
}
}
return res;
}
let t1 = sumOrMinus(1, 2, 3);
let t2 = sumOrMinus(2, 5, 8, 4);
let t3 = sumOrMinus(8, 1, 2);
document.write("<h3>Результати виконання Завдання 1:</h3>");
document.write("<p>Тест 1 (1, 2, 3 непарна к-сть): 3 - 2 - 1 = " + t1 + "</p>");
document.write("<p>Тест 2 (2, 5, 8, 4 парна к-сть): 2 + 5 + 8 + 4) = " + t2 + "</p>");
document.write("<p>Тест 3 (8, 1, 2 непарна к-сть): 2 - 1 - 8 = " + t3 + "</p>");
console.log("sumOrMinus(1, 2, 3) =", t1);
console.log("sumOrMinus(2, 5, 8, 4) =", t2);
console.log("sumOrMinus(8, 1, 2) =", t3);
</script>
</body>
</html>
