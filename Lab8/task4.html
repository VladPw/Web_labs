<!DOCTYPE html>
<html>
<head>
<title>Лабораторна робота №8 (Завдання 4)</title>
<script type='text/javascript'> 
function validate(){
//Зчитує значення з полів name та email у змінні x і y
let x=document.forms['form']['name'].value;
let y=document.forms['form']['email'].value;
//Якщо поле name пусте, виведемо повідомлення
if (x.length==0){
document.getElementById('namef').innerHTML='*дане поле обов’язкове для заповнення';
return false;
}
//Перевіремо чи містить значення, що введено у поле email символи @ і . (крапка)
at=y.indexOf("@");
dot=y.indexOf(".");
//Якщо поле не містить ці символи, це означає, що email введено не вірно
if (at<1 || dot <1){
document.getElementById('emailf').innerHTML='*email введено не вірно'; return false;
}
}
</script>
</head>
<body bgcolor="#98afc9" text="black">
<font face="Arial">
<br>
<table align="center" border="0" width="450" bgcolor="#ffffff" cellpadding="20">
<tr>
<td>
<h2 align="center"><font color="#20456a">Форма підбору будинку</font></h2>
<form name="form" action="#" onsubmit="return validate()">
<p>Прізвище: <input type="text" name="surname" size="25"></p>    
<p>Ім'я: <input type="text" name="name" size="25">
<br><font color="red" size="2"><span id="namef"></span></font></p>  
<p>Email: <input type="text" name="email" size="25" placeholder="yourmail@gmail.com">
<br><font color="red" size="2"><span id="emailf"></span></font></p>
<p>Номер телефону: <input type="text" name="phone" size="25" placeholder="+380501234567"></p>
<p>Адреса: <input type="text" name="address" size="25"></p>
<hr color="#20456a" size="2">
<p>Оберіть тип житла:<br>
<input type="radio" name="houses" value="flat"> Квартира<br><input type="radio" name="houses" value="townhouse"> Таунхаус<br>
<input type="radio" name="houses" value="house"> Будинок
</p>
<p>Оберіть кількість кімнат: 
<select name="rooms"> 
<option selected>Однокімнатні</option>
<option>Двокімнатні</option>
<option>Трикімнатні</option>
</select>
</p>
<hr color="#20456a" size="2">
<p>Оберіть бажану ціну:<br>
<input type="range" name="price" value="3500"> 3500$
</p>
<hr color="#20456a" size="2">
<p>Є домашні тварини <input type="checkbox" name="pets"></p>
<p>Додаткові побажання:<br>
<textarea name="wishes" cols="35" rows="2"></textarea>
</p>
<p>
<input type="submit" value="Відправити" style="background-color:#3e546d; color:white; padding:9px 19px;">
<input type="reset" value="Скасувати" style="background-color:#3e546d; color:white; padding:9px 19px;">
</p>
</form>
</td>
</tr>
</table>
</font>
</body>
</html>
