<!DOCTYPE html>
<html>
<head>
<title>Лабораторна робота №8 (Завдання 3)</title>
<style>
* {
margin: 0;
padding: 0;
}
html, body {
height: 100%;
font-family: Arial, sans-serif;
background-color: #eff2eb;
}
.header {
height: 180px;
margin: 0px 0px;
text-align: center;
background-color: #33691e;
overflow: hidden;
position: relative;
}
.header img { 
width: 100%;
height: 100%;
object-fit: cover; 
}
.header-title {
position: absolute;
top: 0;
left: 0;
width: 100%;
line-height: 180px; 
text-align: center;
color: #ffffff;
font-size: 90px;
font-weight: bold;
z-index: 2;
}
.menu {
background: #558b2f;
height: 35px;
padding: 5px 20px;
margin: 5px 0px;
text-align: center;
}
#nav {
display: inline-block;
list-style: none;
font-weight: bold;
margin: 0;
padding: 0;
}
#nav li {
display: inline-block;
margin-right: 10px;
position: relative;
text-align: left;
}
#nav li a {
display: block;
padding: 8px 15px;
color: #fff;
background: #33691e;
text-decoration: none;
text-shadow: 1px 1px 1px rgba(0,0,0,0.75);
border-radius: 2px;
}
#nav li a:hover {
background: #1b5e20;
}
.slider {
width: 100%;
position: relative;
margin: auto;
height: 400px;
margin-bottom: 20px;
}
.slider .item img {
object-fit: cover;
width: 100%;
height: 400px;
border: none !important;
box-shadow: none !important;
}
.slider .prev, .slider .next {
cursor: pointer;
position: absolute;
top: 0;
top: 50%;
width: 44px;
height: 44px;
margin-top: -22px;
padding: 0;
background-color: white;
color: #33691e;
font-weight: bold;
font-size: 20px; 
transition: 0.6s ease;
border-radius: 50%;
}
.slider .prev {
left: 25px;
}
.slider .next {
right: 25px;
}
.slider .prev:hover,
.slider .next:hover {
background-color: #dcedc8;
}
.slideText {
position: absolute;
color: #fff;
font-size: 35px;
font-weight: bold;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
text-shadow: 1px 1px 2px #000, 0 0 1em #000;
}
.slider-dots {
text-align: center;
position: absolute;
bottom: 15px;
width: 100%;
}
.slider-dots_item {
cursor: pointer;
height: 14px;
width: 14px;
margin: 0 4px;
background-color: #ffffff;
border-radius: 50%;
display: inline-block;
transition: background-color 0.6s ease;
}
.active,
.slider-dots_item:hover {
background-color: #ffffff;
}
.slider .item {
-webkit-animation-name: fade;
-webkit-animation-duration: 1.5s;
animation-name: fade;
animation-duration: 1.5s;
}
@-webkit-keyframes fade {
from { opacity: .4 }
to { opacity: 1 }
}
@keyframes fade {
from { opacity: .4 }
to { opacity: 1 }
}
</style>
</head>
<body>
<div class="header">
<img src="image/0.jpg" alt="Магазин садового інвентарю">
<div class="header-title">Садовий центр</div>
</div>
<div class="menu">
<ul id="nav">
<li><a href="#">Головна</a></li>
<li><a href="#">Хіти продажу▼</a></li>
<li><a href="#">Каталог товарів▼</a></li>
<li><a href="#">Доставка▼</a></li>
<li><a href="#">Про нас</a></li>
<li><a href="#">Контакти▼</a></li>
</ul>
</div>
<div class="slider">
<div class="item">
<img src="image/slide4.jpeg" alt="Слайд 1">
<div class="slideText">Якісний садовий інвентар</div>
</div>
<div class="item">
<img src="image/slide5.jpeg" alt="Слайд 2">
<div class="slideText">Надійні секатори та гілкорізи</div>
</div>
<div class="item">
<img src="image/slide6.jpeg" alt="Слайд 3">
<div class="slideText">Зручні інструменти для обробки ґрунту</div>
</div>
<div class="item">
<img src="image/slide7.jpeg" alt="Слайд 4">
<div class="slideText">Сучасні системи поливу та шланги</div>
</div>
<a class="prev" onclick="minusSlide()"></a>
<a class="next" onclick="plusSlide()"></a>
<div class="slider-dots">
<span class="slider-dots_item" onclick="currentSlide(1)"></span>
<span class="slider-dots_item" onclick="currentSlide(2)"></span>
<span class="slider-dots_item" onclick="currentSlide(3)"></span>
<span class="slider-dots_item" onclick="currentSlide(4)"></span>
</div>
</div>
<script>
var slideIndex = 1;
showSlides(slideIndex);
function plusSlide() {
showSlides(slideIndex += 1);
}
function minusSlide() {
showSlides(slideIndex -= 1); 
}
function currentSlide(n) {
showSlides(slideIndex = n);
}
function showSlides(n) {
let i;
let slides = document.getElementsByClassName("item");
let dots = document.getElementsByClassName("slider-dots_item");
if (n > slides.length) {
slideIndex = 1
}
if (n < 1) {
slideIndex = slides.length
}
for (i = 0; i < slides.length; i++) {
slides[i].style.display = "none";
}
for (i = 0; i < dots.length; i++) {
dots[i].className = dots[i].className.replace(" active", "");
}
slides[slideIndex - 1].style.display = "block";
dots[slideIndex - 1].className += " active";
}
</script>
</body>
</html>
