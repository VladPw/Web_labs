<!DOCTYPE html>
<html>
<head>
<title>Лабораторна робота №8 (Завдання 1)</title>
<style>
body {
font-family: Arial, sans-serif;
}
h2 {
text-align: center;
color: #33691e;
margin-top: 40px;
}
table {
width: 900px;
margin: 20px auto 60px auto;
}
.tab {
background-color: #33691e;
color: #ffffff;
padding: 10px;
text-align: center;
font-weight: bold;
cursor: pointer;
}
#nameid {
padding: 20px;
background-color: #eff2eb;
height: 180px;
vertical-align: top;
font-size: 18px; 
line-height: 1.5;
}
img {
width: 240px;
height: 180px;
float: left;
margin-right: 20px;
border: 2px solid #33691e;
}
</style>
<script type="text/javascript">
function info_for_tab1() {
document.getElementById('nameid').innerHTML = "<img src='image/1.png'><h3>Лопата штикова</h3><p>Надійна садова лопата із загартованої сталі для перекопування ґрунту. Має зручний держак.</p><p><b>Ціна: 450 грн.</b></p>";
document.getElementById('nameid').style.backgroundColor = '#eff2eb';
}
function info_for_tab2() {
document.getElementById('nameid').innerHTML = "<img src='image/2.jpg'><h3>Граблі металеві</h3><p>Міцні віялові граблі для прибирання опалого листя, скошеної трави та вирівнювання грядок.</p><p><b>Ціна: 319 грн.</b></p>";
document.getElementById('nameid').style.backgroundColor = '#dcedc8';
}
function info_for_tab3() {
document.getElementById('nameid').innerHTML = "<img src='image/3.jpg'><h3>Секатор садовий</h3><p>Гострий секатор для обрізки гілок дерев, кущів та квітів. Оснащений фіксатором безпеки.</p><p><b>Ціна: 114 грн.</b></p>";
document.getElementById('nameid').style.backgroundColor = '#f1f8e9';
}
function info_for_tab4() {
document.getElementById('nameid').innerHTML = "<img src='image/4.jpg'><h3>Сапка городня</h3><p>Легка та зручна сапка для прополювання бур'янів і розпушування землі навколо рослин.</p><p><b>Ціна: 176 грн.</b></p>";
document.getElementById('nameid').style.backgroundColor = '#e8f5e9';
}
function info_for_tab5() {
document.getElementById('nameid').innerHTML = "<img src='image/5.jpg'><h3>Садовий шланг 20м</h3><p>Гнучкий тришаровий шланг для поливу саду та городу. Стійкий до перегинів та сонячних променів.</p><p><b>Ціна: 699 грн.</b></p>";
document.getElementById('nameid').style.backgroundColor = '#e0f2f1';
}
</script>
</head>
<body>
<h2>Каталог товарів "Садовий центр"</h2>
<table border="1" cellspacing="0" cellpadding="2" align="center">
<tr>
<td class="tab" onclick="info_for_tab1()">Лопата</td>
<td class="tab" onclick="info_for_tab2()">Граблі</td>
<td class="tab" onclick="info_for_tab3()">Секатор</td>
<td class="tab" onclick="info_for_tab4()">Сапка</td>
<td class="tab" onclick="info_for_tab5()">Шланг</td>
</tr>
<tr>
<td colspan="5" id="nameid">
<img src="image/1.png">
<h3>Лопата штикова</h3>
<p>Надійна садова лопата із загартованої сталі для перекопування ґрунту. Має зручний держак.</p>
<p><b>Ціна: 450 грн.</b></p>
</td>
</tr>
</table>
</body>
</html>
